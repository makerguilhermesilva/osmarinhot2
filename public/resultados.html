<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resultado - Exploração do Oceano</title>
  <style>
    /* ===== ESTILO ATUALIZADO (mesma paleta do site principal) ===== */
    body {
      background: linear-gradient(180deg, #001f3f, #003b73, #005f99);
      color: #e0f7fa;
      font-family: "Poppins", Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 2rem;
      color: #00b4d8;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
      color: #caf0f8;
    }

    p {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 30px;
      color: #bde0fe;
    }

    /* ===== CARD ===== */
    .card {
      display: inline-block;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      padding: 25px 30px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    .card img {
      max-width: 320px;
      width: 100%;
      border-radius: 20px;
      display: block;
      margin: 0 auto 25px auto;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      object-fit: cover;
    }

    /* ===== BOTÃO ===== */
    button {
      padding: 12px 28px;
      background: linear-gradient(90deg, #00b4d8, #0077b6);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 180, 216, 0.4);
    }

    button:hover {
      background: linear-gradient(90deg, #0096c7, #005f99);
      box-shadow: 0 6px 14px rgba(0, 180, 216, 0.6);
      transform: scale(1.03);
    }

    /* ===== ANIMAÇÃO SUAVE ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body, .card {
      animation: fadeIn 0.8s ease;
    }

    /* ===== BOLHAS DECORATIVAS ===== */
    .bubble {
      position: fixed;
      bottom: -80px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: none;
      animation: subir 10s linear infinite;
      z-index: 0;
    }

    @keyframes subir {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>🌊 Emoção detectada:</h1>
  <h2 id="emocaoTitle">Processando...</h2>
  <p id="confTitle"></p>

  <div class="card">
    <img id="imagemEmocao" alt="Imagem relacionada à emoção" />
    <button onclick="voltar()">Voltar</button>
  </div>

  <script>
    // === Lógica original preservada ===
    const imagensPorEmocao = {
      feliz: [
        'static/mar_feliz/1.jpg',
      ],
      triste: [
        'static/mar_triste/1.png',
      ],
      neutro: [
        'static/mar_neutro/1.png',
      ]
    };

    const traducoes = {
      happy: 'feliz',
      sad: 'triste',
      neutral: 'neutro',
      angry: 'triste',
      fearful: 'triste',
      disgusted: 'triste',
      surprised: 'feliz'
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function imagemAleatoria(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    const emocaoOriginal = getQueryParam('emocao') || 'neutral';
    const conf = getQueryParam('conf') || '0';
    const emocaoTraduzida = traducoes[emocaoOriginal] || 'nenhuma';

    document.getElementById('emocaoTitle').innerText =
      emocaoTraduzida.charAt(0).toUpperCase() + emocaoTraduzida.slice(1);
    document.getElementById('confTitle').innerText = `Confiança: ${conf}%`;

    if (imagensPorEmocao[emocaoTraduzida] && imagensPorEmocao[emocaoTraduzida].length > 0) {
      document.getElementById('imagemEmocao').src = imagemAleatoria(imagensPorEmocao[emocaoTraduzida]);
    } else {
      document.getElementById('imagemEmocao').style.display = 'none';
    }

    function voltar() {
      window.location.href = 'index.html';
    }

    // === Bolhas animadas decorativas ===
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 25 + 10;
      b.style.width = b.style.height = `${size}px`;
      b.style.left = Math.random() * 100 + 'vw';
      b.style.animationDuration = 8 + Math.random() * 8 + 's';
      b.style.opacity = Math.random();
      document.body.appendChild(b);
    }
  </script>
</body>
</html>
